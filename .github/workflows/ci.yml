name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # GitHub-hosted only: this repo is public, and fork pull requests must never run on self-hosted machines.
    runs-on: macos-15
    # Hosted macOS minutes are free only for public repos; skip while the repo is still private.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        # swift-testing and universal builds need Xcode; use the newest one the image has.
        run: |
          # Newest versioned Xcode on the image, else Xcode.app, else the image default. Never a fixed path.
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          [ -n "$xcode" ] || { [ -d /Applications/Xcode.app ] && xcode=/Applications/Xcode.app; }
          if [ -n "$xcode" ]; then
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "Using $xcode"
          else
            echo "Using the image default: $(xcode-select -p)"
          fi
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release packaging (not published)
        run: ./scripts/release.sh
      - name: Smoke test with a fixture
        run: |
          set -- dist/presence-*-macos-universal/presence
          PRESENCE_FIXTURE=Tests/PresenceCoreTests/Fixtures/idle.json "$1" --json | grep -q '"state":"idle"'
